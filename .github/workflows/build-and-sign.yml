name: Build and Sign Container Image

on:
  push:
    branches: [main]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      gh_repo: ${{ steps.to_lowercase.outputs.gh_repo }}
      gh_sha: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # tag=v4.4.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # tag=v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: To lowercase
        id: to_lowercase
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          gh_repo_value=$(echo "$GH_REPO" | tr '[:upper:]' '[:lower:]')
          echo "gh_repo=$gh_repo_value" >> "$GITHUB_OUTPUT"
          
      - name: Build and push image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # tag=v7.4.0
        with:
          push: true
          tags: ghcr.io/${{ steps.to_lowercase.outputs.gh_repo }}:${{ github.sha }}
          context: "01-supply-chain-security"

  sign:
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      id-token: write
      packages: write
    env:
      DIGEST: ${{ needs.build.outputs.gh_sha }}
      IMAGE_REPO: ${{ needs.build.outputs.gh_repo }}
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # tag=v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # tag=v4.1.3

      - name: Generate SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # tag=v0.36.0
        with:
          image-ref: "ghcr.io/${{ env.IMAGE_REPO }}@${{ env.DIGEST }}"
          format: 'spdx-json'
          output: 'sbom.spdx.json'

      - name: Attach SBOM        
        run: |
          cosign attest --yes \
            --predicate sbom.spdx.json \
            --type spdxjson \
            "ghcr.io/${IMAGE_REPO}@${DIGEST}"

      - name: Sign the container image (keyless)
        run: |
          cosign sign --yes \
            "ghcr.io/${IMAGE_REPO}@${DIGEST}"

      
