name: Build and Sign Container Image

on:
  push:
    branches: [main]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      gh_repo: ${{ steps.to_lowercase.outputs.gh_repo }}
      gh_sha: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # tag=v4.4.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # tag=v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: To lowercase
        id: to_lowercase
        run: |
          gh_repo_value=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "gh_repo=$gh_repo_value" >> "$GITHUB_OUTPUT"
          
      - name: Build and push image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # tag=v7.4.0
        with:
          push: true
          tags: ghcr.io/${{ steps.to_lowercase.outputs.gh_repo }}:${{ github.sha }}

  sign:
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      id-token: write
      packages: write
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # tag=v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # tag=v4.1.3

      - name: Sign the container image (keyless)
        env:
          DIGEST: ${{ needs.build.outputs.gh_sha }}
          IMAGE_REPO: ${{ needs.build.outputs.gh_repo }}
        run: |
          cosign sign --yes \
            "ghcr.io/${IMAGE_REPO}@${DIGEST}"
