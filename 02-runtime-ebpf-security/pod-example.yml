apiVersion: v1
kind: Pod
metadata:
  name: httpd-pod
  namespace: prod-payments
  labels:
    app: payments-api
spec:
  containers:
    - name: httpd
      image: nginx
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 256Mi
      ports:
        - containerPort: 80
